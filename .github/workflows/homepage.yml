#
# Builds and deploys the homepage (docs/homepage) to GitHub Pages. The typst
# version is pinned by build.sh because HTML export is still experimental
# upstream.

name: homepage

on:
  push:
    branches: [master]
    paths:
      - 'docs/homepage/**'
      - '.github/workflows/homepage.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the site
        run: docs/homepage/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/homepage/site
      - id: deployment
        uses: actions/deploy-pages@v4
