[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-dna"
version = "0.1.0"
description = "Phoenix DNA desktop agent daemon - a D-Bus service for the Phoenix DNA plasmoid"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]

[project.scripts]
phoenix-dna-agent = "phoenix_dna.__main__:main"
phoenix-dna-repl = "phoenix_dna.repl:main"

# No hard dependencies: dbus-python / PyGObject come from the distribution
# packages (python3-dbus, python3-gobject). pytest is a dev dependency.
[tool.setuptools]
packages = ["phoenix_dna", "phoenix_dna.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
