[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-agent"
version = "0.1.0"
description = "Phoenix AI desktop agent daemon - a D-Bus service for the Phoenix plasmoid"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]

[project.scripts]
phoenix-agent = "phoenix_ai.__main__:main"
phoenix-repl = "phoenix_ai.repl:main"

# No hard dependencies: dbus-python / PyGObject come from the distribution
# packages (python3-dbus, python3-gobject). pytest is a dev dependency.
[tool.setuptools]
packages = ["phoenix_ai", "phoenix_ai.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
