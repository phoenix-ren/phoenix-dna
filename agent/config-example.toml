# Phoenix DNA agent daemon - example configuration.
# Copy to ~/.config/phoenix-dna/agent.toml and edit.
# API keys do NOT go here; put them in ~/.config/phoenix-dna/keys.json or env vars.

[agent]
# provider = "minimax"            # or "fake" for a canned-response test provider
# model = "MiniMax-M3"             # multimodal; MiniMax-Text-01 cannot see images
# vision = true                   # send attached images to the model; "auto"
#                                 # (the default) decides from the model name -
#                                 # "auto" already covers MiniMax-M3
# llm_base_url = "https://api.minimax.io/v1"
# request_timeout = 120
# max_turns = 24
# credential_ttl_seconds = 900    # how long a cached sudo password is reused
# bash_default_timeout = 60
# bash_max_timeout = 600
# max_output_chars = 20000
# sudo_bin = "/usr/bin/sudo"
# kdialog_bin = "/usr/bin/kdialog"
# ask_timeout_seconds = 300       # unanswered ask_user questions release the
#                                 # run after this long (0 = wait forever)
# confirm_destructive = true      # root mode: destructive bash commands need
#                                 # an explicit Allow (fail closed on timeout)
# confirm_patterns = []           # extra regexes that count as destructive,
#                                 # e.g. ["\\bsystemctl\\s+restart\\b"]
